<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>

  <style>
    /* =========================================================
       SOLID M3 THEME TOKENS (Strictly Zero Gradients)
       ========================================================= */
    :root, [data-theme="obsidian"] {
      --md-background: #191919;
      --md-surface-container: #232323;
      --md-surface-container-high: #2b2b2b;
      --md-surface-container-highest: #333333;
      --md-primary: #a8c7fa;
      --md-on-primary: #062e6f;
      --md-on-surface: #e3e2e6;
      --md-on-surface-variant: #c4c6d0;
      --md-outline: #44474e;
      --md-outline-variant: #35383f;
      --top-hit-bg: #0063e1;
      --top-hit-active: #0052bd;
    }

    [data-theme="navy"] {
      --md-background: #10141d;
      --md-surface-container: #171c26;
      --md-surface-container-high: #1f2533;
      --md-surface-container-highest: #283040;
      --md-primary: #82aaff;
      --md-on-primary: #002b75;
      --md-on-surface: #e1e7f5;
      --md-on-surface-variant: #b0b9cc;
      --md-outline: #3d4758;
      --md-outline-variant: #283244;
      --top-hit-bg: #1d4ed8;
      --top-hit-active: #1e40af;
    }

    [data-theme="espresso"] {
      --md-background: #1b1716;
      --md-surface-container: #241e1c;
      --md-surface-container-high: #2e2725;
      --md-surface-container-highest: #3a322f;
      --md-primary: #f3b79d;
      --md-on-primary: #4a2818;
      --md-on-surface: #f2e4df;
      --md-on-surface-variant: #cbbab3;
      --md-outline: #52443e;
      --md-outline-variant: #3c322d;
      --top-hit-bg: #8c4a2f;
      --top-hit-active: #723b24;
    }

    [data-theme="pine"] {
      --md-background: #121815;
      --md-surface-container: #18221c;
      --md-surface-container-high: #202c25;
      --md-surface-container-highest: #293830;
      --md-primary: #9ddcb4;
      --md-on-primary: #0f3822;
      --md-on-surface: #e1ede5;
      --md-on-surface-variant: #b4c5bb;
      --md-outline: #3d4e43;
      --md-outline-variant: #2a372f;
      --top-hit-bg: #1e5e3a;
      --top-hit-active: #174a2e;
    }

    :root {
      --apple-ease: cubic-bezier(0.32, 0.72, 0, 1);
      --apple-duration: 380ms;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* Speed of Light: Native System Font (0ms Network Latency) */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      outline: none !important;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      background-color: var(--md-background);
      color: var(--md-on-surface);
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* Top Action Button */
    .top-bar {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 20;
      transition: opacity var(--apple-duration) var(--apple-ease),
                  transform var(--apple-duration) var(--apple-ease);
    }

    .md-icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      border: none;
      background-color: transparent;
      color: var(--md-on-surface-variant);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .md-icon-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--md-on-surface);
    }

    /* Dead-Center Stage */
    .center-stage {
      position: relative;
      width: 100%;
      max-width: 680px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Clock & Date */
    .clock-section {
      position: absolute;
      bottom: calc(100% + 32px);
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: auto;
      transform-origin: center bottom;
      transition: opacity var(--apple-duration) var(--apple-ease),
                  transform var(--apple-duration) var(--apple-ease);
    }

    .time {
      font-size: 4.8rem;
      font-weight: 300;
      letter-spacing: -1.5px;
      font-variant-numeric: tabular-nums;
      color: var(--md-on-surface);
      line-height: 1;
    }

    .date {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--md-on-surface-variant);
      margin-top: 10px;
      letter-spacing: 0.25px;
    }

    /* M3 Pill Search Bar (Dead-Center Anchor) */
    .search-form {
      width: 100%;
      position: relative;
      z-index: 30;
    }

    .md-search-bar {
      height: 58px;
      width: 100%;
      background-color: var(--md-surface-container-high);
      border-radius: 9999px;
      display: flex;
      align-items: center;
      padding: 0 14px 0 10px;
      border: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transform-origin: center center;
      transition: background-color var(--apple-duration) var(--apple-ease),
                  transform var(--apple-duration) var(--apple-ease),
                  box-shadow var(--apple-duration) var(--apple-ease);
    }

    .md-search-bar:hover {
      background-color: var(--md-surface-container-highest);
    }

    /* Custom Engine Dropdown */
    .custom-dropdown {
      position: relative;
      display: flex;
      align-items: center;
      margin-right: 12px;
    }

    .engine-trigger-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px 6px 8px;
      background-color: var(--md-surface-container);
      border: 1px solid var(--md-outline-variant);
      border-radius: 9999px;
      cursor: pointer;
      color: var(--md-on-surface-variant);
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .engine-trigger-btn:hover {
      background-color: var(--md-surface-container-highest);
      color: var(--md-on-surface);
    }

    .engine-trigger-btn .engine-svg-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .caret-icon {
      width: 14px;
      height: 14px;
      transition: transform var(--apple-duration) var(--apple-ease);
    }

    .custom-dropdown.open .caret-icon {
      transform: rotate(180deg);
    }

    .custom-dropdown-menu {
      position: absolute;
      top: calc(100% + 12px);
      left: 0;
      width: 210px;
      background-color: var(--md-surface-container-high);
      border: 1px solid var(--md-outline-variant);
      border-radius: 18px;
      padding: 6px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.7);
      z-index: 100;
      transform-origin: top left;
      transform: scale(0.9) translateY(-10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--apple-duration) var(--apple-ease),
                  transform var(--apple-duration) var(--apple-ease);
    }

    .custom-dropdown.open .custom-dropdown-menu {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      padding: 9px 12px;
      border-radius: 12px;
      cursor: pointer;
      color: var(--md-on-surface);
      font-size: 0.9rem;
      font-weight: 500;
      transition: background-color 0.12s ease;
    }

    .dropdown-item:hover {
      background-color: var(--md-surface-container-highest);
    }

    .dropdown-item.active {
      color: var(--md-primary);
    }

    .dropdown-item .engine-svg-icon {
      width: 20px;
      height: 20px;
      margin-right: 12px;
    }

    .dropdown-item .check-icon {
      margin-left: auto;
      width: 16px;
      height: 16px;
      color: var(--md-primary);
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .dropdown-item.active .check-icon {
      opacity: 1;
      transform: scale(1);
    }

    /* Input Field */
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--md-on-surface);
      font-size: 1.05rem;
      font-weight: 400;
    }

    .search-input::placeholder {
      color: #72747d;
    }

    /* Trailing Actions */
    .kbd-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--md-surface-container);
      border: 1px solid var(--md-outline);
      color: var(--md-on-surface-variant);
      font-size: 0.8rem;
      font-weight: 500;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      margin-left: 8px;
      transition: opacity var(--apple-duration) var(--apple-ease),
                  transform var(--apple-duration) var(--apple-ease);
    }

    .submit-arrow-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background-color: transparent;
      color: var(--md-on-surface);
      cursor: pointer;
      margin-left: 6px;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .submit-arrow-btn:hover {
      background-color: rgba(255, 255, 255, 0.12);
      transform: translateX(2px);
    }

    .search-has-text .submit-arrow-btn {
      display: flex;
    }

    .search-has-text .kbd-badge {
      display: none;
    }

    /* =========================================================
       SUGGESTIONS DROPDOWN (Matches your Screenshot)
       ========================================================= */
    .suggestions-container {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background-color: var(--md-surface-container-high);
      border: 1px solid var(--md-outline-variant);
      border-radius: 20px;
      padding: 6px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.75);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 90;
      max-height: 440px;
      overflow-y: auto;
      transform-origin: top center;
      animation: suggestIn var(--apple-duration) var(--apple-ease);
    }

    .suggestions-container.active {
      display: flex;
    }

    @keyframes suggestIn {
      from { opacity: 0; transform: scale(0.97) translateY(-6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* 1. Top Hit Item (Blue Pill / Direct Navigation) */
    .top-hit-item {
      background-color: var(--top-hit-bg);
      color: #ffffff;
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background-color 0.15s ease;
    }

    .top-hit-item:hover, .top-hit-item.selected {
      background-color: var(--top-hit-active);
    }

    .top-hit-favicon {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.1);
    }

    .top-hit-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
    }

    .top-hit-domain {
      font-weight: 400;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-hit-tag {
      margin-left: auto;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background-color: rgba(255, 255, 255, 0.22);
      padding: 2px 7px;
      border-radius: 6px;
    }

    /* 2. Regular Search Suggestions */
    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 14px;
      border-radius: 12px;
      color: var(--md-on-surface);
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .suggestion-item:hover, .suggestion-item.selected {
      background-color: var(--md-surface-container-highest);
    }

    .suggestion-icon {
      color: var(--md-on-surface-variant);
      display: flex;
      align-items: center;
    }

    .sug-prefix {
      font-weight: 400;
      color: var(--md-on-surface-variant);
    }

    .sug-suffix {
      font-weight: 700;
      color: var(--md-on-surface);
    }

    /* 3. Section Header (Firefox Suggest Style) */
    .dropdown-section-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--md-on-surface-variant);
      padding: 10px 14px 4px;
      letter-spacing: 0.5px;
    }

    /* 4. Quick Links Items */
    .quick-link-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .quick-link-item:hover, .quick-link-item.selected {
      background-color: var(--md-surface-container-highest);
    }

    .quick-link-favicon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: contain;
    }

    .quick-link-title {
      font-weight: 600;
      color: var(--md-on-surface);
      white-space: nowrap;
    }

    .quick-link-domain {
      color: var(--md-on-surface-variant);
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Shortcuts Grid with Number Key Badges */
    .shortcuts-container {
      position: absolute;
      top: calc(100% + 36px);
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      transform-origin: center top;
      transition: opacity var(--apple-duration) var(--apple-ease),
                  transform var(--apple-duration) var(--apple-ease);
    }

    .md-shortcut-card {
      position: relative;
      width: 92px;
      padding: 14px 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      background-color: var(--md-surface-container);
      border-radius: 16px;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .md-shortcut-card:hover {
      background-color: var(--md-surface-container-high);
      transform: translateY(-2px);
    }

    .shortcut-badge {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--md-on-surface-variant);
      background-color: var(--md-surface-container-high);
      border: 1px solid var(--md-outline-variant);
      border-radius: 4px;
      padding: 1px 5px;
      line-height: 1.1;
    }

    .favicon-avatar {
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      background-color: var(--md-background);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      transition: background-color 0.25s ease;
    }

    .favicon-avatar img {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      object-fit: contain;
    }

    .shortcut-name {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--md-on-surface);
      max-width: 78px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /* Active Search State (Fluid Centering, NO BORDERS) */
    body.is-focused .clock-section {
      opacity: 0;
      transform: translateY(-28px) scale(0.92);
      pointer-events: none;
    }

    body.is-focused .shortcuts-container {
      opacity: 0;
      transform: translateY(28px) scale(0.92);
      pointer-events: none;
    }

    body.is-focused .top-bar {
      opacity: 0;
      transform: translateY(-12px) scale(0.85);
      pointer-events: none;
    }

    body.is-focused .md-search-bar {
      background-color: var(--md-surface-container-highest);
      transform: scale(1.025);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    }

    /* Material 3 Settings Dialog */
    .md-dialog-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--apple-duration) var(--apple-ease);
    }

    .md-dialog-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .md-dialog {
      width: 90%;
      max-width: 460px;
      background-color: var(--md-surface-container-high);
      border-radius: 28px;
      padding: 24px;
      transform: scale(0.92);
      transition: transform var(--apple-duration) var(--apple-ease);
      max-height: 85vh;
      overflow-y: auto;
    }

    .md-dialog-overlay.active .md-dialog {
      transform: scale(1);
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .dialog-title {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--md-on-surface);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .settings-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--md-primary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .theme-chip {
      background-color: var(--md-surface-container);
      border: 1px solid var(--md-outline-variant);
      padding: 10px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .theme-chip:hover {
      background-color: var(--md-surface-container-highest);
    }

    .theme-chip.active {
      border-color: var(--md-primary);
      background-color: var(--md-surface-container-highest);
    }

    .theme-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .theme-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--md-on-surface);
    }

    .form-field {
      margin-bottom: 16px;
    }

    .md-input {
      width: 100%;
      height: 48px;
      background-color: var(--md-surface-container);
      border: 1px solid var(--md-outline);
      border-radius: 8px;
      padding: 0 14px;
      color: var(--md-on-surface);
      font-size: 0.95rem;
      transition: border-color 0.2s ease;
    }

    .md-input:focus {
      border-color: var(--md-primary);
    }

    .md-filled-button {
      height: 40px;
      padding: 0 20px;
      border-radius: 9999px;
      background-color: var(--md-primary);
      color: var(--md-on-primary);
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      transition: opacity 0.15s ease;
    }

    .md-filled-button:hover {
      opacity: 0.92;
    }

    .shortcut-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 8px;
    }

    .shortcut-list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: var(--md-surface-container);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .shortcut-list-item img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }

    .shortcut-list-item span {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .del-btn {
      background: transparent;
      border: none;
      color: #ffb4ab;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 9999px;
    }

    .del-btn:hover {
      background-color: rgba(255, 180, 171, 0.12);
    }
  </style>
</head>
<body>

  <!-- Top Action Button -->
  <header class="top-bar">
    <button class="md-icon-btn" id="open-settings" aria-label="Settings">
      <svg class="icon" viewBox="0 0 256 256"><path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Zm88-29.84V125.84a16,16,0,0,0-12.87-15.71l-15.54-3.11a79.52,79.52,0,0,0-7.89-19l8.6-13.33a16,16,0,0,0-2.45-20.15l-14.14-14.14a16,16,0,0,0-20.15-2.45l-13.33,8.6a79.52,79.52,0,0,0-19-7.89l-3.11-15.54A16,16,0,0,0,106.16,8H93.84a16,16,0,0,0-15.71,12.87L75,36.41a79.52,79.52,0,0,0-19,7.89l-13.33-8.6a16,16,0,0,0-20.15,2.45L28.38,52.29a16,16,0,0,0-2.45,20.15l8.6,13.33a79.52,79.52,0,0,0-7.89,19L11.1,107.87A16,16,0,0,0,8,123.84v12.32a16,16,0,0,0,12.87,15.71l15.54,3.11a79.52,79.52,0,0,0,7.89,19l-8.6,13.33a16,16,0,0,0,2.45,20.15l14.14,14.14a16,16,0,0,0,20.15,2.45l13.33-8.6a79.52,79.52,0,0,0,19,7.89l3.11,15.54A16,16,0,0,0,93.84,248h12.32a16,16,0,0,0,15.71-12.87l3.11-15.54a79.52,79.52,0,0,0,19-7.89l13.33,8.6a16,16,0,0,0,20.15-2.45l14.14-14.14a16,16,0,0,0,2.45-20.15l-8.6-13.33a79.52,79.52,0,0,0,7.89-19l15.54-3.11A16,16,0,0,0,216,130.16Z"/></svg>

  <!-- Material 3 Settings Dialog -->
  <div class="md-dialog-overlay" id="dialog-overlay">

      <div class="dialog-header">
        <h2 class="dialog-title">
          <svg class="icon" viewBox="0 0 256 256"><path d="M120,40a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16h72A8,8,0,0,1,120,40Zm96,72H168a8,8,0,0,0,0,16h48a8,8,0,0,0,0-16Zm-16,80H40a8,8,0,0,0,0,16H184a8,8,0,0,0,0-16ZM144,24a24,24,0,0,0-24,24v0a24,24,0,0,0,24,24h0a24,24,0,0,0,24-24v0A24,24,0,0,0,144,24Zm0,32a8,8,0,1,1,8-8A8,8,0,0,1,144,56ZM88,96a24,24,0,0,0-24,24v0a24,24,0,0,0,24,24h0a24,24,0,0,0,24-24v0A24,24,0,0,0,88,96Zm0,32a8,8,0,1,1,8-8A8,8,0,0,1,88,128Zm120,56a24,24,0,0,0-24,24v0a24,24,0,0,0,24,24h0a24,24,0,0,0,24-24v0A24,24,0,0,0,208,184Zm0,32a8,8,0,1,1,8-8A8,8,0,0,1,208,216Z"/></svg>
          Preferences
        </h2>
        <button class="md-icon-btn" id="close-settings" style="width:36px; height:36px;">
          <svg class="icon" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>

      <!-- Solid M3 Palette Picker -->
      <div class="settings-section-title">Solid Theme Palette</div>
      <div class="theme-grid">
        <div class="theme-chip" data-theme-val="obsidian">

      <!-- Add Shortcut -->
      <div class="settings-section-title">Add Shortcut (Keys 1–6)</div>
      <div class="form-field">
        <input type="text" id="shortcut-name" class="md-input" placeholder="Title (e.g. YouTube)" style="margin-bottom: 8px;" />
        <input type="text" id="shortcut-url" class="md-input" placeholder="URL (e.g. youtube.com)" style="margin-bottom: 12px;" />
        <button type="button" class="md-filled-button" id="add-btn">
          <svg class="icon" style="width:16px;height:16px;" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg>
          Add Shortcut

      <!-- Manage List -->
      <div class="settings-section-title" style="margin-top: 20px;">Manage Shortcuts</div>
      <div class="form-field">

      </div>

  </div>

  <script>
    // Embedded Vector SVGs (0ms Network Latency, 100% Offline)
    const ENGINE_SVGS = {
      google: `<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.03h3.88c2.27-2.09 3.665-5.17 3.665-9.12z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.03c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.13C3.28 21.44 7.34 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.57H1.25C.45 8.16 0 9.98 0 12s.45 3.84 1.25 5.43l4.03-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.28 2.56 1.25 6.57l4.03 3.14c.95-2.83 3.6-4.96 6.72-4.96z"/></svg>`,
      duckduckgo: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#DE5833"/><path d="M11 7h2v6h-2zm0 8h2v2h-2z" fill="#FFF"/></svg>`,
      brave: `<svg viewBox="0 0 24 24"><path fill="#FB542B" d="M12 0l7.24 4.54-1.28 7.37L12 24l-5.96-12.09L4.76 4.54 12 0z"/></svg>`,
      bing: `<svg viewBox="0 0 24 24"><path fill="#008373" d="m3.84 0 5.48 1.93v16.14l7.15-4.14-3.57-2.38-2.22 1.48V7.5l9.48 4.7v5.93l-10.89 5.87L3.84 20.4z"/></svg>`,
      youtube: `<svg viewBox="0 0 24 24"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.5 12 3.5 12 3.5s-7.505 0-9.377.55a3.016 3.016 0 0 0-2.122 2.136C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.55 9.376.55 9.376.55s7.505 0 9.377-.55a3.016 3.016 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><polygon fill="#FFF" points="9.545 15.568 15.795 12 9.545 8.432"/></svg>`,
      github: `<svg viewBox="0 0 24 24"><path fill="#FFF" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>`
    };

    const ENGINES = [
      { id: "google", name: "Google", url: "https://www.google.com/search?q=" },
      { id: "duckduckgo", name: "DuckDuckGo", url: "https://duckduckgo.com/?q=" },
      { id: "brave", name: "Brave", url: "https://search.brave.com/search?q=" },
      { id: "bing", name: "Bing", url: "https://www.bing.com/search?q=" },
      { id: "youtube", name: "YouTube", url: "https://www.youtube.com/results?search_query=" },
      { id: "github", name: "GitHub", url: "https://github.com/search?q=" }
    ];

    const POPULAR_DEEP_LINKS = {
      'instagram.com': [
        { title: 'Instagram • Messages', url: 'https://instagram.com/direct/inbox/' },
        { title: 'Instagram • Explore', url: 'https://instagram.com/explore/' }
      ],
      'reddit.com': [
        { title: 'Reddit • Popular', url: 'https://reddit.com/r/popular/' },
        { title: 'Reddit • All', url: 'https://reddit.com/r/all/' }
      ],
      'github.com': [
        { title: 'GitHub • Pull Requests', url: 'https://github.com/pulls' },
        { title: 'GitHub • Trending', url: 'https://github.com/trending' }
      ],
      'youtube.com': [
        { title: 'YouTube • Subscriptions', url: 'https://youtube.com/feed/subscriptions' },
        { title: 'YouTube • Library', url: 'https://youtube.com/feed/library' }
      ]
    };

    const DEFAULT_SHORTCUTS = [
      { name: "YouTube", url: "https://www.youtube.com" },
      { name: "GitHub", url: "https://www.github.com" },
      { name: "Reddit", url: "https://www.reddit.com" },
      { name: "ChatGPT", url: "https://chatgpt.com" },
      { name: "X", url: "https://x.com" },
      { name: "Gmail", url: "https://mail.google.com" }
    ];

    let currentEngineId = localStorage.getItem("selected_engine") || "google";
    let shortcuts = JSON.parse(localStorage.getItem("shortcuts")) || DEFAULT_SHORTCUTS;
    let currentTheme = localStorage.getItem("app_theme") || "obsidian";

    function getActiveEngine() {
      return ENGINES.find(e => e.id === currentEngineId) || ENGINES[0];
    }

    function isUrl(str) {
      str = str.trim();
      if (/^https?:\/\//i.test(str)) return true;
      if (/^localhost(:\d+)?(\/.*)?$/i.test(str)) return true;
      if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?(\/.*)?$/.test(str)) return true;
      const domainPattern = /^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*\.[a-zA-Z]{2,}(:\d+)?(\/.*)?$/;
      return domainPattern.test(str);
    }

    function formatUrl(url) {
      url = url.trim();
      if (/^https?:\/\//i.test(url)) return url;
      if (/^localhost/i.test(url) || /^\d{1,3}(\.\d{1,3}){3}/.test(url)) return 'http://' + url;
      return 'https://' + url;
    }

    function getDomain(url) {
      try {
        return new URL(formatUrl(url)).hostname;
      } catch {
        return url.replace(/^https?:\/\//i, '').split('/')[0].split('?')[0];
      }
    }

    function getSiteTitle(domain) {
      const clean = domain.replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0].toLowerCase();
      const shortcut = shortcuts.find(s => getDomain(s.url).replace(/^www\./, '').toLowerCase() === clean);
      if (shortcut) return shortcut.name;
      const namePart = clean.split('.')[0];
      return namePart.charAt(0).toUpperCase() + namePart.slice(1);
    }

    function getFavicon(url) {
      return `https://www.google.com/s2/favicons?domain=${getDomain(url)}&sz=128`;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    // --- Synchronous Speed-of-Light Clock ---
    const clockEl = document.getElementById('clock');
    const dateEl = document.getElementById('date');
    const dateOptions = { weekday: 'long', month: 'short', day: 'numeric' };

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      clockEl.textContent = `${h}:${m}:${s}`;
      dateEl.textContent = now.toLocaleDateString(undefined, dateOptions);
    }
    updateClock();
    setInterval(updateClock, 1000);

    // --- Theme Application ---
    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("app_theme", theme);
      document.querySelectorAll(".theme-chip").forEach(chip => {
        chip.classList.toggle("active", chip.dataset.themeVal === theme);
      });
    }

    document.querySelectorAll(".theme-chip").forEach(chip => {
      chip.addEventListener("click", () => applyTheme(chip.dataset.themeVal));
    });
    applyTheme(currentTheme);

    // --- Custom Dropdown Engine Selector ---
    const dropdown = document.getElementById("engine-dropdown");
    const dropdownMenu = document.getElementById("engine-menu");
    const engineTrigger = document.getElementById("engine-trigger");
    const activeEngineIcon = document.getElementById("active-engine-icon");
    const input = document.getElementById("search-input");
    const searchBar = document.getElementById("search-bar");

    function renderEngineDropdown() {
      dropdownMenu.innerHTML = "";
      const current = getActiveEngine();
      activeEngineIcon.innerHTML = ENGINE_SVGS[current.id];
      input.placeholder = `Search with ${current.name} or enter URL`;

      ENGINES.forEach(engine => {
        const item = document.createElement("div");
        item.className = `dropdown-item ${engine.id === currentEngineId ? 'active' : ''}`;
        item.innerHTML = `
          <span class="engine-svg-icon">${ENGINE_SVGS[engine.id]}</span>
          <span>${engine.name}</span>
          <svg class="check-icon" viewBox="0 0 256 256"><path fill="currentColor" d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/></svg>
        `;
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          currentEngineId = engine.id;
          localStorage.setItem("selected_engine", currentEngineId);
          dropdown.classList.remove("open");
          renderEngineDropdown();
          input.focus();
        });
        dropdownMenu.appendChild(item);
      });
    }

    engineTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      const isOpen = dropdown.classList.toggle("open");
      if (isOpen) document.body.classList.add("is-focused");
    });

    // --- Shortcuts Rendering ---
    function renderShortcuts() {
      const grid = document.getElementById("shortcuts-grid");
      const list = document.getElementById("shortcut-list");
      grid.innerHTML = "";
      list.innerHTML = "";

      shortcuts.forEach((item, index) => {
        const card = document.createElement("a");
        card.href = formatUrl(item.url);
        card.className = "md-shortcut-card";
        card.innerHTML = `
          ${index < 6 ? `<span class="shortcut-badge">${index + 1}</span>` : ''}
          <div class="favicon-avatar">
            <img src="${getFavicon(item.url)}" alt="${item.name}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23999%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'">
          </div>
          <span class="shortcut-name">${item.name}</span>
        `;
        grid.appendChild(card);

        const row = document.createElement("div");
        row.className = "shortcut-list-item";
        row.innerHTML = `
          <img src="${getFavicon(item.url)}" alt="" loading="lazy">
          <span>${item.name}</span>
          <button class="del-btn" onclick="removeShortcut(${index})" title="Delete">
            <svg class="icon" viewBox="0 0 256 256"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/></svg>
          </button>
        `;
        list.appendChild(row);
      });
    }

    window.removeShortcut = function(index) {
      shortcuts.splice(index, 1);
      localStorage.setItem("shortcuts", JSON.stringify(shortcuts));
      renderShortcuts();
    };

    document.getElementById("add-btn").addEventListener("click", () => {
      const nameInput = document.getElementById("shortcut-name");
      const urlInput = document.getElementById("shortcut-url");
      const name = nameInput.value.trim();
      const url = urlInput.value.trim();

      if (name && url) {
        shortcuts.push({ name, url });
        localStorage.setItem("shortcuts", JSON.stringify(shortcuts));
        renderShortcuts();
        nameInput.value = "";
        urlInput.value = "";
      }
    });

    // --- Live Suggestions & Instant Top Hit ---
    const suggestionsBox = document.getElementById("suggestions-box");
    let currentScript = null;
    let selectedDropdownIndex = -1;
    let currentDropdownItems = [];
    let debounceTimer = null;

    function fetchSuggestions(query) {
      if (!query || query.trim() === '') {
        closeSuggestions();
        return;
      }

      // 0ms Instant Local Top Hit Render
      if (isUrl(query)) {
        renderDropdownCombined(query, []);
      }

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        if (currentScript) currentScript.remove();
        const script = document.createElement("script");
        script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleSuggestions`;
        document.body.appendChild(script);
        currentScript = script;
      }, 100);
    }

    window.handleSuggestions = function(data) {
      const rawQuery = input.value.trim();
      if (!rawQuery) {
        closeSuggestions();
        return;
      }
      const searchSuggestions = (data && data[1]) ? data[1].slice(0, 5) : [];
      renderDropdownCombined(rawQuery, searchSuggestions);
    };

    function renderDropdownCombined(query, searchSuggestions) {
      suggestionsBox.innerHTML = "";
      currentDropdownItems = [];
      const queryIsUrl = isUrl(query);

      // 1. TOP HIT
      if (queryIsUrl) {
        const fullUrl = formatUrl(query);
        const domain = getDomain(query);
        const title = getSiteTitle(domain);

        const topHitItem = {
          type: 'url',
          url: fullUrl,
          title: title,
          subtitle: query.replace(/^https?:\/\//i, ''),
          icon: getFavicon(domain),
          isTopHit: true
        };
        currentDropdownItems.push(topHitItem);

        const topHitEl = document.createElement("div");
        topHitEl.className = "top-hit-item selected";
        topHitEl.innerHTML = `
          <img src="${topHitItem.icon}" class="top-hit-favicon" alt="">
          <span class="top-hit-title">${escapeHtml(topHitItem.title)}</span>
          <span class="top-hit-domain">— ${escapeHtml(topHitItem.subtitle)}</span>
          <span class="top-hit-tag">Visit</span>
        `;
        topHitEl.addEventListener("mousedown", (e) => {
          e.preventDefault();
          window.location.href = fullUrl;
        });
        suggestionsBox.appendChild(topHitEl);
        selectedDropdownIndex = 0;
      } else {
        selectedDropdownIndex = -1;
      }

      // 2. SEARCH SUGGESTIONS (Bold Completion)
      searchSuggestions.forEach((text) => {
        const itemObj = { type: 'search', text: text };
        const itemIndex = currentDropdownItems.length;
        currentDropdownItems.push(itemObj);

        let htmlText = "";
        const qLower = query.toLowerCase();
        const tLower = text.toLowerCase();
        if (tLower.startsWith(qLower)) {
          const matched = text.slice(0, query.length);
          const remainder = text.slice(query.length);
          htmlText = `<span class="sug-prefix">${escapeHtml(matched)}</span><strong class="sug-suffix">${escapeHtml(remainder)}</strong>`;
        } else {
          htmlText = `<span>${escapeHtml(text)}</span>`;
        }

        const sugEl = document.createElement("div");
        sugEl.className = "suggestion-item";
        sugEl.dataset.index = itemIndex;
        sugEl.innerHTML = `
          <span class="suggestion-icon"><svg class="icon" viewBox="0 0 256 256"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg></span>
          <div>${htmlText}</div>
        `;
        sugEl.addEventListener("mousedown", (e) => {
          e.preventDefault();
          const engine = getActiveEngine();
          window.location.href = engine.url + encodeURIComponent(text);
        });
        suggestionsBox.appendChild(sugEl);
      });

      // 3. QUICK LINKS
      const domainKey = getDomain(query).replace(/^www\./, '').toLowerCase();
      let quickLinks = POPULAR_DEEP_LINKS[domainKey] || [];
      const matchingShortcuts = shortcuts.filter(s => s.name.toLowerCase().includes(query.toLowerCase()) || s.url.toLowerCase().includes(query.toLowerCase()));
      
      matchingShortcuts.forEach(s => {
        if (!quickLinks.some(q => q.url === s.url)) quickLinks.push({ title: s.name, url: s.url });
      });

      if (quickLinks.length > 0) {
        const headerEl = document.createElement("div");
        headerEl.className = "dropdown-section-label";
        headerEl.textContent = "Quick Links";
        suggestionsBox.appendChild(headerEl);

        quickLinks.slice(0, 3).forEach(link => {
          const itemIndex = currentDropdownItems.length;
          currentDropdownItems.push({ type: 'url', url: link.url });

          const qlEl = document.createElement("div");
          qlEl.className = "quick-link-item";
          qlEl.dataset.index = itemIndex;
          qlEl.innerHTML = `
            <img src="${getFavicon(link.url)}" class="quick-link-favicon" alt="" loading="lazy">
            <span class="quick-link-title">${escapeHtml(link.title)}</span>
            <span class="quick-link-domain">— ${escapeHtml(link.url.replace(/^https?:\/\//i, ''))}</span>
          `;
          qlEl.addEventListener("mousedown", (e) => {
            e.preventDefault();
            window.location.href = formatUrl(link.url);
          });
          suggestionsBox.appendChild(qlEl);
        });
      }

      if (currentDropdownItems.length > 0) {
        suggestionsBox.classList.add("active");
      } else {
        closeSuggestions();
      }
    }

    function closeSuggestions() {
      suggestionsBox.classList.remove("active");
      suggestionsBox.innerHTML = "";
      selectedDropdownIndex = -1;
      currentDropdownItems = [];
    }

    function executeSearchOrNav() {
      const query = input.value.trim();
      if (!query) return;

      if (selectedDropdownIndex >= 0 && currentDropdownItems[selectedDropdownIndex]) {
        const item = currentDropdownItems[selectedDropdownIndex];
        if (item.type === 'url') {
          window.location.href = item.url;
          return;
        } else {
          const engine = getActiveEngine();
          window.location.href = engine.url + encodeURIComponent(item.text);
          return;
        }
      }

      if (isUrl(query)) {
        window.location.href = formatUrl(query);
        return;
      }

      const engine = getActiveEngine();
      window.location.href = engine.url + encodeURIComponent(query);
    }

    const form = document.getElementById("search-form");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      executeSearchOrNav();
    });

    input.addEventListener("input", (e) => {
      const val = e.target.value;
      searchBar.classList.toggle("search-has-text", val.trim().length > 0);
      fetchSuggestions(val);
    });

    input.addEventListener("focus", () => {
      document.body.classList.add("is-focused");
      if (input.value.trim()) fetchSuggestions(input.value.trim());
    });

    // --- Instant Keyboard Actions ---
    const dialog = document.getElementById("dialog-overlay");

    window.addEventListener("keydown", (e) => {
      const isModalOpen = dialog.classList.contains("active");

      // 1. '/' Toggle Focus
      if (e.key === "/" && !isModalOpen) {
        if (document.activeElement === input) {
          if (input.value.trim() === "") {
            e.preventDefault();
            input.blur();
            document.body.classList.remove("is-focused");
            closeSuggestions();
          }
        } else {
          e.preventDefault();
          input.focus();
        }
        return;
      }

      // 2. Number Keys (1-6)
      if (!isModalOpen && document.activeElement !== input) {
        const num = parseInt(e.key, 10);
        if (!isNaN(num) && num >= 1 && num <= 6 && num <= shortcuts.length) {
          e.preventDefault();
          window.location.href = formatUrl(shortcuts[num - 1].url);
          return;
        }
      }

      // 3. Arrow Keys
      if (suggestionsBox.classList.contains("active") && currentDropdownItems.length > 0) {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          selectedDropdownIndex = (selectedDropdownIndex + 1) % currentDropdownItems.length;
          updateHighlight();
          return;
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          selectedDropdownIndex = (selectedDropdownIndex - 1 + currentDropdownItems.length) % currentDropdownItems.length;
          updateHighlight();
          return;
        }
      }

      // 4. Escape Key
      if (e.key === "Escape") {
        if (dropdown.classList.contains("open")) {
          dropdown.classList.remove("open");
        } else if (isModalOpen) {
          dialog.classList.remove("active");
        } else if (suggestionsBox.classList.contains("active")) {
          closeSuggestions();
        } else if (document.activeElement === input) {
          input.blur();
          document.body.classList.remove("is-focused");
        }
      }
    });

    function updateHighlight() {
      const allItems = suggestionsBox.querySelectorAll(".top-hit-item, .suggestion-item, .quick-link-item");
      allItems.forEach((el, idx) => el.classList.toggle("selected", idx === selectedDropdownIndex));
      if (selectedDropdownIndex >= 0 && currentDropdownItems[selectedDropdownIndex]) {
        const item = currentDropdownItems[selectedDropdownIndex];
        if (item.type === 'search') input.value = item.text;
      }
    }

    window.addEventListener("click", (e) => {
      const searchBar = document.getElementById("search-bar");
      if (!searchBar.contains(e.target) && !suggestionsBox.contains(e.target)) {
        dropdown.classList.remove("open");
        closeSuggestions();
        if (document.body.classList.contains("is-focused")) {
          document.body.classList.remove("is-focused");
          input.blur();
        }
      }
    });

    document.getElementById("open-settings").addEventListener("click", () => dialog.classList.add("active"));
    document.getElementById("close-settings").addEventListener("click", () => dialog.classList.remove("active"));
    dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.classList.remove("active"); });

    // Synchronous execution for instantaneous 0ms display
    renderEngineDropdown();
    renderShortcuts();
  </script>
</body>
</html>
